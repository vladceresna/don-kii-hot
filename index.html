<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>KiiLang Studio</title>
        <link rel="stylesheet" href="style.css" />

        <!-- CodeMirror для редактора с подсветкой -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css"
        />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/mode/simple.min.js"></script>
    </head>
    <body>
        <div class="toolbar">
            <div class="logo">KiiLang Studio</div>
            <button id="add-file-btn">+ New File</button>
            <button id="run-btn" class="run-btn">▶ Run (main.kii)</button>
            <button id="clear-btn">Clear Terminal</button>
        </div>

        <div class="main-container">
            <!-- Левое меню (Explorer) -->
            <div class="sidebar">
                <div class="sidebar-title">EXPLORER</div>
                <ul id="file-list"></ul>
            </div>

            <div class="workspace">
                <!-- Вкладки и Редактор -->
                <div class="editor-pane">
                    <div class="tabs" id="tabs-container"></div>
                    <div id="editor-container"></div>
                </div>

                <!-- Терминал -->
                <div class="terminal-pane" id="terminal-pane">
                    <div class="terminal-header">TERMINAL</div>
                    <div id="terminal-output"></div>
                    <div
                        class="terminal-input-line"
                        id="terminal-input-line"
                        style="display: none"
                    >
                        <span class="prompt">&gt;</span>
                        <input
                            type="text"
                            id="terminal-input"
                            autocomplete="off"
                        />
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
