<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>KiiLang Retro Studio</title>

        <!-- Пиксельные шрифты -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
            rel="stylesheet"
        />

        <!-- CodeMirror ядро -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/mode/simple.min.js"></script>

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- CRT эффект старого экрана -->
        <div class="crt-overlay"></div>

        <div class="toolbar">
            <div class="logo">KIILANG OS</div>
            <button id="add-file-btn">[+ NEW FILE]</button>
            <button id="run-btn" class="run-btn">[▶ RUN MAIN]</button>
            <button id="clear-btn">[CLEAR TERMINAL]</button>
        </div>

        <div class="main-container">
            <!-- Левое меню (Explorer) -->
            <div class="sidebar">
                <div class="sidebar-title">DATA_DRIVES</div>
                <ul id="file-list"></ul>
            </div>

            <div class="workspace">
                <!-- Вкладки и Редактор -->
                <div class="editor-pane">
                    <div class="tabs" id="tabs-container"></div>
                    <div id="editor-container"></div>
                </div>

                <!-- Терминал -->
                <div class="terminal-pane" id="terminal-pane">
                    <div class="terminal-header">SYS_TERMINAL</div>
                    <div id="terminal-output"></div>
                    <div
                        class="terminal-input-line"
                        id="terminal-input-line"
                        style="display: none"
                    >
                        <span class="prompt">&gt;</span>
                        <input
                            type="text"
                            id="terminal-input"
                            autocomplete="off"
                        />
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
